name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep mne / matplotlib from booting a GUI backend on headless CI.
env:
  MNE_USE_NUMBA: "false"
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev/eval extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval,dev]"

      - name: Show installed versions
        run: |
          python --version
          pip list

      - name: Run pytest
        run: pytest -q

      - name: Lint (real errors only)
        run: ruff check src/refrain --select F,E9

  # NOTE: This job cannot be validated locally — it requires a real GitHub
  # Actions runner with network access to download the Rust toolchain and
  # Python packages.  The toolchain wiring must be confirmed on first CI push.
  rust-equivalence:
    runs-on: ubuntu-latest
    # Run on a single Python version; the equivalence gate is about Rust/Python
    # parity, not Python version coverage (that is the `test` job's concern).
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + eval extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval,dev]"

      - name: Show installed versions
        run: |
          python --version
          pip list

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run equivalence drift gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python refrain-core/tools/check_equivalence.py
