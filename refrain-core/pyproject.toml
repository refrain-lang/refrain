[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "refrain-core"
# Lockstep with the root pyproject.toml `version` — both packages are built
# from the same commit on every v* tag and are equivalence-gated in CI, so
# they share one version number. Bump both together in the release PR
# (guarded by tests/test_version_lockstep.py).
version = "0.13.0"
description = "Portable Refrain real-time evaluator (PoC) — Python binding"
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]
module-name = "refrain_core"
